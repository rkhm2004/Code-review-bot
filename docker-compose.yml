services:
  analysis-service:
    build:
      context: .
      dockerfile: analysis-service/Dockerfile
    container_name: cs4-analysis
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2:3b
      - RAG_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - RAG_DATA_DIR=/app/data/rag
      - AUDIT_DB_PATH=/app/data/cs4_audit.sqlite3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - cs4_data:/app/data

  backend:
    build:
      context: ./mcp-server
    container_name: cs4-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - ANALYSIS_SERVICE_URL=http://analysis-service:8000
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - ALLOWED_REPOSITORIES=${ALLOWED_REPOSITORIES:-}
    depends_on:
      - analysis-service

  frontend:
    build:
      context: ./frontend
    container_name: cs4-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - backend

volumes:
  cs4_data:
